[project]
name = "gtm-outbound-agent"
version = "0.1.0"
description = "Multi-agent GTM outbound system: research, scoring, personas, writing, critique. With optional v2 learning loop (episodic + semantic + procedural memory)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.28",
    "pydantic>=2.0",
    "sqlmodel>=0.0.14",
    "psycopg[binary]>=3.1",
    "chromadb>=0.5",
    "langfuse>=2.0",
    "streamlit>=1.28",
    "plotly>=5.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_outbound"]
